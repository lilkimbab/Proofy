[project]
name = "study-agent-problem-feedback"
version = "0.1.0"
description = "FastAPI service for material-grounded problem generation and learning feedback."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.6",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "openai>=1.50.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm and not rag'"
markers = [
  "llm: tests that call the live OpenAI API and require OPENAI_API_KEY",
  "rag: tests that call the live team RAG/Search or generated artifact index server",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "evals*", "docs*"]
